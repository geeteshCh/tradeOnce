[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeonce"
version = "0.1.0"
description = "A verified improvement loop for trading-agent execution code."
requires-python = ">=3.12,<3.14"
dependencies = [
    "harness2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.28.1",
    "pydantic>=2.6,<3",
    "rich>=15.0.0",
    "google-genai>=3.0.0",
    "pymongo>=4.15,<5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["arena*", "auditor*", "builder*", "loop*", "stage*", "providers*", "storage*", "harnessing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
harness2 = { git = "https://github.com/google-research/harness2.git", rev = "6868817518876de8fd170c6a8354daca273b6191" }

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["harness2.*"]
ignore_missing_imports = true

# The fixed legacy auditor is outside this integration's typed boundary.
[[tool.mypy.overrides]]
module = ["auditor.*"]
ignore_errors = true

# Check the new typed integration while retaining the existing Arena/loop code.
[[tool.mypy.overrides]]
module = ["arena.*", "loop.*"]
follow_imports = "silent"
