[project]
name = "tradeonce"
version = "0.1.0"
description = "A verified improvement loop for trading-agent execution code."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "pymongo>=4.15,<5",
]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
