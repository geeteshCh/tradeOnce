[project]
name = "tradeonce"
version = "0.1.0"
description = "A verified improvement loop for trading-agent execution code."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "pydantic>=2,<3",
    "pymongo>=4.15,<5",
]

[tool.ruff]
target-version = "py311"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
