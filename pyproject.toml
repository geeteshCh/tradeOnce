[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeonce"
version = "0.1.0"
description = "A verified improvement loop for trading-agent execution code."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.28.1",
    "pydantic>=2.6,<3",
    "rich>=15.0.0",
    "google-genai>=3.0.0",
    "pymongo>=4.15,<5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["arena*", "auditor*", "loop*", "stage*", "providers*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
